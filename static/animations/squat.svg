<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Ground -->
  <line x1="10" y1="180" x2="190" y2="180" stroke="#888" stroke-width="2"/>
  
  <!-- Head -->
  <circle cx="100" cy="40" r="12" fill="#4caf50">
    <animate attributeName="cy" values="40;70;40" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Torso -->
  <line x1="100" y1="52" x2="100" y2="110" stroke="#4caf50" stroke-width="6" stroke-linecap="round">
    <animate attributeName="y1" values="52;82;52" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="110;140;110" dur="2s" repeatCount="indefinite"/>
  </line>
  
  <!-- Upper Leg (thigh) - bends at knee -->
  <line x1="100" y1="110" x2="75" y2="140" stroke="#4caf50" stroke-width="6" stroke-linecap="round">
    <animate attributeName="y1" values="110;140;110" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="75;60;75" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="140;155;140" dur="2s" repeatCount="indefinite"/>
  </line>
  
  <!-- Lower Leg (shin) -->
  <line x1="75" y1="140" x2="75" y2="175" stroke="#4caf50" stroke-width="6" stroke-linecap="round">
    <animate attributeName="x1" values="75;60;75" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="140;155;140" dur="2s" repeatCount="indefinite"/>
  </line>
  
  <!-- Arms (stretched forward) -->
  <line x1="100" y1="70" x2="140" y2="75" stroke="#4caf50" stroke-width="5" stroke-linecap="round">
    <animate attributeName="y1" values="70;100;70" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="75;105;75" dur="2s" repeatCount="indefinite"/>
  </line>
</svg>
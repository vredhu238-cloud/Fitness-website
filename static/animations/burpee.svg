<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <line x1="10" y1="200" x2="190" y2="200" stroke="#888" stroke-width="2"/>
  
  <g>
    <!-- Jump motion -->
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -30; 0 0; 0 0" dur="2.5s" repeatCount="indefinite"/>
    
    <!-- Head -->
    <circle cx="100" cy="50" r="12" fill="#e91e63"/>
    
    <!-- Torso -->
    <line x1="100" y1="62" x2="100" y2="120" stroke="#e91e63" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Arms (up in air) -->
    <line x1="100" y1="80" x2="70" y2="50" stroke="#e91e63" stroke-width="5" stroke-linecap="round"/>
    <line x1="100" y1="80" x2="130" y2="50" stroke="#e91e63" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Legs (bent - jump pose) -->
    <line x1="100" y1="120" x2="85" y2="160" stroke="#e91e63" stroke-width="6" stroke-linecap="round"/>
    <line x1="85" y1="160" x2="75" y2="190" stroke="#e91e63" stroke-width="5" stroke-linecap="round"/>
    
    <line x1="100" y1="120" x2="115" y2="160" stroke="#e91e63" stroke-width="6" stroke-linecap="round"/>
    <line x1="115" y1="160" x2="125" y2="190" stroke="#e91e63" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
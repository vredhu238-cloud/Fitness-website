<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <line x1="10" y1="120" x2="190" y2="120" stroke="#888" stroke-width="2"/>
  
  <g>
    <!-- Body (straight horizontal line) -->
    <line x1="60" y1="90" x2="140" y2="90" stroke="#2196f3" stroke-width="7" stroke-linecap="round">
      <animate attributeName="y1" values="90;87;90" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="90;87;90" dur="3s" repeatCount="indefinite"/>
    </line>
    
    <!-- Head -->
    <circle cx="150" cy="85" r="10" fill="#2196f3">
      <animate attributeName="cy" values="85;82;85" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Forearms (on ground) -->
    <line x1="135" y1="90" x2="150" y2="115" stroke="#2196f3" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Legs -->
    <line x1="60" y1="90" x2="20" y2="115" stroke="#2196f3" stroke-width="5" stroke-linecap="round"/>
    <line x1="20" y1="115" x2="10" y2="115" stroke="#2196f3" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
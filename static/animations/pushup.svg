<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <!-- Ground line -->
  <line x1="10" y1="120" x2="190" y2="120" stroke="#888" stroke-width="2"/>
  
  <!-- BODY GROUP - yeh group upar-neeche hilega -->
  <g>
    <!-- Torso (dhad) - horizontal line (push-up position) -->
    <line x1="80" y1="90" x2="130" y2="90" stroke="#ff6b35" stroke-width="6" stroke-linecap="round">
      <animate attributeName="y1" values="90;75;90" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="90;75;90" dur="2s" repeatCount="indefinite"/>
    </line>
    
    <!-- Head -->
    <circle cx="140" cy="85" r="10" fill="#ff6b35">
      <animate attributeName="cy" values="85;70;85" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Left Leg (behind) -->
    <line x1="80" y1="90" x2="30" y2="110" stroke="#ff6b35" stroke-width="5" stroke-linecap="round">
      <animate attributeName="y1" values="90;75;90" dur="2s" repeatCount="indefinite"/>
    </line>
    <!-- Left Foot -->
    <line x1="30" y1="110" x2="15" y2="115" stroke="#ff6b35" stroke-width="5" stroke-linecap="round">
      <animate attributeName="y1" values="110;95;110" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="115;100;115" dur="2s" repeatCount="indefinite"/>
    </line>
    
    <!-- Right Leg (front) -->
    <line x1="80" y1="90" x2="35" y2="115" stroke="#cc5528" stroke-width="5" stroke-linecap="round">
      <animate attributeName="y1" values="90;75;90" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="115;100;115" dur="2s" repeatCount="indefinite"/>
    </line>
    
    <!-- Left Arm (bending) -->
    <line x1="130" y1="90" x2="155" y2="120" stroke="#ff6b35" stroke-width="5" stroke-linecap="round">
      <animate attributeName="y1" values="90;75;90" dur="2s" repeatCount="indefinite"/>
    </line>
    <!-- Right Arm -->
    <line x1="125" y1="90" x2="150" y2="120" stroke="#cc5528" stroke-width="5" stroke-linecap="round">
      <animate attributeName="y1" values="90;75;90" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
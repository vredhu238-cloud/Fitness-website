<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Head -->
  <circle cx="100" cy="40" r="12" fill="#ff9800"/>
  
  <!-- Torso -->
  <line x1="100" y1="52" x2="100" y2="130" stroke="#ff9800" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Left Leg -->
  <line x1="100" y1="130" x2="85" y2="185" stroke="#ff9800" stroke-width="5" stroke-linecap="round"/>
  <!-- Right Leg -->
  <line x1="100" y1="130" x2="115" y2="185" stroke="#ff9800" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Left Arm (still) -->
  <line x1="100" y1="70" x2="70" y2="120" stroke="#ff9800" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Right Upper Arm (fixed) -->
  <line x1="100" y1="70" x2="130" y2="110" stroke="#ff9800" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Right Forearm (BENDING - only y2 changes) -->
  <line x1="130" y1="110" x2="130" y2="150" stroke="#f57c00" stroke-width="5" stroke-linecap="round">
    <animate attributeName="y2" values="150;70;150" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="130;110;130" dur="1.5s" repeatCount="indefinite"/>
  </line>
  
  <!-- Dumbbell (moves with forearm) -->
  <rect x="120" y="145" width="20" height="10" fill="#333" rx="2">
    <animate attributeName="y" values="145;65;145" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="120;100;120" dur="1.5s" repeatCount="indefinite"/>
  </rect>
</svg>
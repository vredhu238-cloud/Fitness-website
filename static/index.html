<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitIndia - Complete Fitness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gray-100 font-sans">

    <!-- HEADER -->
    <header class="bg-gradient-to-r from-orange-500 to-red-600 text-white p-5 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">💪 FitIndia</h1>
            <nav class="flex gap-4 items-center">
                <a href="/" class="hover:underline font-semibold">Home / होम</a>
                <a href="/diet.html" class="hover:underline font-semibold">Diet / आहार</a>
                <button id="langBtn" class="bg-white text-orange-600 px-4 py-1 rounded-full font-semibold hover:bg-gray-200 transition">
                    हिंदी
                </button>
            </nav>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="text-center py-10 px-4">
        <h2 class="text-4xl font-bold text-gray-800 mb-3" data-en="Get Fit, Stay Strong" data-hi="फिट रहें, मजबूत रहें">Get Fit, Stay Strong</h2>
        <p class="text-gray-600 text-lg" data-en="Your complete fitness companion" data-hi="आपका पूरा फिटनेस साथी">Your complete fitness companion</p>
    </section>

    <!-- NEW FEATURES DASHBOARD (3 Columns) -->
    <section class="max-w-6xl mx-auto px-4 mb-12">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- 1. BMI CALCULATOR -->
            <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-blue-500">
                <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">⚖️ BMI Calculator</h3>
                <div class="space-y-3">
                    <input type="number" id="weight" placeholder="Weight (kg)" class="w-full border p-2 rounded focus:outline-blue-500">
                    <input type="number" id="height" placeholder="Height (cm)" class="w-full border p-2 rounded focus:outline-blue-500">
                    <button onclick="calculateBMI()" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 transition">Calculate BMI</button>
                    <div id="bmiResult" class="text-center font-bold text-lg text-blue-700 mt-2 hidden"></div>
                </div>
            </div>

            <!-- 2. WATER TRACKER -->
            <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-cyan-500 relative overflow-hidden">
                <!-- Background water wave animation -->
                <div class="water-wave absolute bottom-0 left-0 w-full h-8 bg-cyan-200 opacity-50 z-0"></div>
                <div class="relative z-10">
                    <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">💧 Water Tracker</h3>
                    <div class="text-center">
                        <p class="text-4xl font-bold text-cyan-600 mb-2" id="waterCount">0 / 8</p>
                        <p class="text-sm text-gray-500 mb-4">Glasses aaj piye</p>
                        <div class="flex justify-center gap-2">
                            <button onclick="updateWater(-1)" class="bg-gray-200 px-4 py-2 rounded hover:bg-gray-300">-</button>
                            <button onclick="updateWater(1)" class="bg-cyan-500 text-white px-6 py-2 rounded hover:bg-cyan-600 transition">+ Add Glass</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. WORKOUT TIMER -->
            <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-purple-500">
                <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">⏱️ Workout Timer</h3>
                <div class="text-center">
                    <p class="text-5xl font-mono font-bold text-purple-700 mb-4" id="timerDisplay">00:00</p>
                    <div class="flex justify-center gap-2">
                        <button onclick="startTimer()" id="startBtn" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600 transition w-full">Start</button>
                        <button onclick="resetTimer()" class="bg-gray-200 px-4 py-2 rounded hover:bg-gray-300 w-full">Reset</button>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- EXERCISES SECTION -->
    <section class="max-w-6xl mx-auto px-4 pb-12">
        <h3 class="text-2xl font-bold text-gray-800 mb-6" data-en="🏋️ Exercises" data-hi="🏋️ व्यायाम">🏋️ Exercises</h3>
        <div id="exerciseList" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <p class="text-gray-500">Loading exercises...</p>
        </div>
    </section>

    <footer class="bg-gray-800 text-white text-center py-4 mt-10">
        <p>© 2026 FitIndia — Made with ❤️</p>
    </footer>

    <script src="/static/script.js"></script>
</body>
</html>
